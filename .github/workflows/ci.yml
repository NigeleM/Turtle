name: CI

# Validates every push to main and every PR: build, vet, and the real
# `go test` suite. Separate from release.yml, which only runs when a
# version tag is pushed — this one exists so a broken commit is caught
# immediately instead of only being discovered at release time.
#
# Scope excludes the root "Turtle" package (the legacy Turtle_interpreter.go,
# kept around unmodified for reference — see PROGRESS.md) because it uses
# cgo, whose C-compiler warnings get surfaced by GitHub as "failure"-level
# annotations even though they never fail the build. Files/ has no cgo and
# stays in scope.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./sqlite/... ./token/...

      - name: Vet
        run: go vet ./Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./sqlite/... ./token/...

      - name: Test
        run: go test ./Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./sqlite/... ./token/... -v
