name: CI

# Build, vet and test every push to main and every PR. legacy/ itself
# needs cgo, so only legacy/Files/ is checked.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    # Real servers for the postgres and mysql drivers (and
    # testdata/sql/13_servers.turtle); without the URLs those tests skip.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: turtle
          POSTGRES_PASSWORD: turtlepw
          POSTGRES_DB: turtle
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U turtle" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: turtle
          MYSQL_USER: turtle
          MYSQL_PASSWORD: turtlepw
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpw" --health-interval 5s
          --health-timeout 5s --health-retries 30
    env:
      TURTLE_PG_URL: postgres://turtle:turtlepw@localhost:55432/turtle
      TURTLE_MYSQL_URL: mysql://turtle:turtlepw@127.0.0.1:53306/turtle
      # The official sqlite3 checks every database file Turtle writes;
      # without the tool those checks fail rather than quietly skip.
      TURTLE_REQUIRE_SQLITE3: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sqlite3 (to check the files Turtle writes)
        run: sudo apt-get install -y sqlite3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Vet
        run: go vet ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Test
        run: go test ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/... -v

      - name: Build the Linux installers
        run: installer/linux/build.sh 0.0.0-ci "$RUNNER_TEMP"

      - name: Test the VS Code extension
        run: |
          out=$(sh editors/vscode/test/run.sh)
          echo "$out"
          echo "$out" | grep -q "^working:  warnings=0" && echo "$out" | grep -q "^run:      saved=2 terminals=1" && ! echo "$out" | grep -q ERROR

  # The same tests on macOS and Windows, so a problem on either shows up
  # on the push that causes it, not only when a release is tagged (file
  # locking, open files and the system sqlite3 differ there). Database
  # server containers only run on Linux, so those tests skip here.
  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS has sqlite3 and Windows gets it below, so the checks must
      # run on both.
      TURTLE_REQUIRE_SQLITE3: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sqlite3 (to check the files Turtle writes)
        if: matrix.os == 'windows-latest'
        run: choco install sqlite -y --no-progress

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: go vet ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Test
        run: go test ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Build the macOS installer
        if: matrix.os == 'macos-latest'
        run: installer/macos/build-pkg.sh 0.0.0-ci "$RUNNER_TEMP"

      # The installer the release makes, built (not installed) so a mistake
      # in installer/turtle.iss shows up now, not on release day.
      - name: Build the Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          $env:CGO_ENABLED="0"
          go build -o turtle.exe ./cmd/turtle
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DOutputDir=$env:RUNNER_TEMP" installer\turtle.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
