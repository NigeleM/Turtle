name: CI

# Validates every push to main and every PR: build, vet, and the real
# `go test` suite. Separate from release.yml, which only runs when a
# version tag is pushed — this one exists so a broken commit is caught
# immediately instead of only being discovered at release time.
#
# Scope excludes the legacy interpreter in legacy/ (Turtle_interpreter.go,
# kept for reference — see legacy/README.md) because it uses
# cgo, whose C-compiler warnings get surfaced by GitHub as "failure"-level
# annotations even though they never fail the build. legacy/Files/ has no cgo and
# stays in scope.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    # Real servers for the postgres and mysql drivers (and
    # testdata/sql/13_servers.trt); without the URLs those tests skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: turtle
          POSTGRES_PASSWORD: turtlepw
          POSTGRES_DB: turtle
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U turtle" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: turtle
          MYSQL_USER: turtle
          MYSQL_PASSWORD: turtlepw
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpw" --health-interval 5s
          --health-timeout 5s --health-retries 30
    env:
      TURTLE_PG_URL: postgres://turtle:turtlepw@localhost:55432/turtle
      TURTLE_MYSQL_URL: mysql://turtle:turtlepw@127.0.0.1:53306/turtle
      # The official sqlite3 checks every database file Turtle writes;
      # without the tool those checks fail rather than quietly skip.
      TURTLE_REQUIRE_SQLITE3: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sqlite3 (to check the files Turtle writes)
        run: sudo apt-get install -y sqlite3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./legacy/Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Vet
        run: go vet ./legacy/Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Test
        run: go test ./legacy/Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/... -v

  # The same tests on macOS and Windows, so a problem on either shows up
  # on the push that causes it, not only when a release is tagged (file
  # locking, open files and the system sqlite3 differ there). Database
  # server containers only run on Linux, so those tests skip here.
  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS has sqlite3, so its checks must run; Windows has none.
      TURTLE_REQUIRE_SQLITE3: ${{ matrix.os == 'macos-latest' && '1' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: go vet ./legacy/Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Test
        run: go test ./legacy/Files/... ./ast/... ./cmd/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...
