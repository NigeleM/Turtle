name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    # Real servers for the postgres and mysql drivers (and
    # testdata/sql/13_servers.turtle), installed on the runner below: the
    # Docker images are rate-limited on the public registry, so they can't
    # be pulled reliably. Without the URLs those tests skip.
    env:
      TURTLE_PG_URL: postgres://turtle:turtlepw@localhost:5432/turtle
      TURTLE_MYSQL_URL: mysql://turtle:turtlepw@127.0.0.1:3306/turtle
      # The official sqlite3 checks every database file Turtle writes;
      # without the tool those checks fail rather than quietly skip.
      TURTLE_REQUIRE_SQLITE3: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sqlite3 (to check the files Turtle writes)
        run: sudo apt-get install -y sqlite3

      - name: Start PostgreSQL and MySQL (for the server tests)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql mysql-server
          sudo systemctl start postgresql
          sudo systemctl start mysql
          sudo -u postgres psql -c "CREATE USER turtle WITH PASSWORD 'turtlepw' CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE turtle OWNER turtle;"
          # The runner's root login needs a password, so the setup SQL runs as
          # the server itself, at startup (--init-file), then the server stops
          # and the normal service starts with the turtle user in place.
          cat > /tmp/turtle-init.sql <<'SQL'
          CREATE DATABASE IF NOT EXISTS turtle;
          CREATE USER IF NOT EXISTS 'turtle'@'localhost' IDENTIFIED BY 'turtlepw';
          CREATE USER IF NOT EXISTS 'turtle'@'%' IDENTIFIED BY 'turtlepw';
          GRANT ALL ON turtle.* TO 'turtle'@'localhost';
          GRANT ALL ON turtle.* TO 'turtle'@'%';
          SQL
          sudo chmod 644 /tmp/turtle-init.sql
          sudo systemctl stop mysql
          sudo mkdir -p /var/run/mysqld
          sudo chown mysql:mysql /var/run/mysqld
          sudo mysqld --user=mysql --init-file=/tmp/turtle-init.sql &
          for i in $(seq 1 60); do mysqladmin --socket=/var/run/mysqld/mysqld.sock ping 2>/dev/null && break; sleep 1; done
          sleep 5
          sudo pkill -x mysqld || true
          for i in $(seq 1 60); do pgrep -x mysqld >/dev/null || break; sleep 1; done
          sudo systemctl start mysql
          mysql -h 127.0.0.1 -P 3306 -u turtle -pturtlepw turtle -e "select 1" || { sudo tail -60 /var/log/mysql/error.log; sudo journalctl -u mysql --no-pager | tail -40; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: go build ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Vet
        run: go vet ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Test
        run: go test ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/... -v

      - name: Build the Linux installers
        run: installer/linux/build.sh 0.0.0-ci "$RUNNER_TEMP"

      - name: Test the VS Code extension
        run: |
          out=$(sh editors/vscode/test/run.sh)
          echo "$out"
          echo "$out" | grep -q "^working:  warnings=0" && echo "$out" | grep -q "^run:      saved=2 terminals=1" && ! echo "$out" | grep -q ERROR

  # The same tests on macOS and Windows, so a problem on either shows up
  # on the push that causes it, not only when a release is tagged (file
  # locking, open files and the system sqlite3 differ there). Database
  # server containers only run on Linux, so those tests skip here.
  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS has sqlite3 and Windows gets it below, so the checks must
      # run on both.
      TURTLE_REQUIRE_SQLITE3: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sqlite3 (to check the files Turtle writes)
        if: matrix.os == 'windows-latest'
        run: choco install sqlite -y --no-progress

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: go vet ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      - name: Test
        run: go test ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

      # The real program, as a user runs it: the built turtle.exe on one of the
      # checked programs (its own failures: 0 line decides the exit code).
      - name: Smoke test the built program
        if: matrix.os == 'windows-latest'
        run: |
          go build -o turtle.exe ./cmd/turtle
          ./turtle.exe testdata/programs/multiline.turtle
          "7" | ./turtle.exe testdata/programs/language_core.turtle

      - name: Build the macOS installer
        if: matrix.os == 'macos-latest'
        run: installer/macos/build-pkg.sh 0.0.0-ci "$RUNNER_TEMP"

      # The installer the release makes, built (not installed) so a mistake
      # in installer/turtle.iss shows up now, not on release day.
      - name: Build the Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          $env:CGO_ENABLED="0"
          go build -o turtle.exe ./cmd/turtle
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DOutputDir=$env:RUNNER_TEMP" installer\turtle.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # No change may make Turtle slower or hungrier: bench/ run with the
  # commit before and with this one, taking turns on the same machine
  # (scripts/perfcheck.go).
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compare with the commit before
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: go run scripts/perfcheck.go -base "$BASE" -rounds 5

  # Random and mangled programs for a minute each: the parser and the
  # interpreter must give errors, never crash or hang. (go test above runs
  # the fuzz tests' seed programs every time.)
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Fuzz the parser
        run: go test ./parser -run '^$' -fuzz FuzzParse -fuzztime 60s

      - name: Fuzz the interpreter
        run: go test ./evaluator -run '^$' -fuzz FuzzRun -fuzztime 60s
