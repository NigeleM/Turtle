name: Release

# Runs only when a version tag (v0.1.7, v1.0.0, ...) is pushed — not on
# every push to main. That's the fix for the old behavior, where every
# ordinary push silently tried to overwrite the same hardcoded "v0.1.6"
# release. The version packaged into each artifact is derived from the
# tag itself, so bumping a version is just "tag and push" — nothing to
# edit in this file.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Vet and test
      run: |
        go vet ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...
        go test ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

    - name: Create macOS Installer
      # installer/macos/build-pkg.sh: turtle for Apple silicon and Intel,
      # and Turtle.app for .turtle files (icon, double-click to run).
      run: installer/macos/build-pkg.sh "${{ github.ref_name }}" release

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        # 0.x versions are pre-releases: GitHub shows the badge.
        prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
        files: release/turtle.pkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Vet and test
      run: |
        go vet ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...
        go test ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

    - name: Create Linux Installers
      # installer/linux/build.sh: a .deb and a .tar.gz, for amd64 and arm64.
      run: installer/linux/build.sh "${{ github.ref_name }}" release

    - name: Upload Linux Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        # 0.x versions are pre-releases: GitHub shows the badge.
        prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
        files: |
          release/turtle-linux-amd64.deb
          release/turtle-linux-arm64.deb
          release/turtle-linux-amd64.tar.gz
          release/turtle-linux-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Vet and test
      run: |
        go vet ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...
        go test ./legacy/Files/... ./ast/... ./cmd/... ./docs/... ./evaluator/... ./lexer/... ./object/... ./parser/... ./postgres/... ./mysql/... ./sqlite/... ./toml/... ./token/... ./syntax/... ./format/... ./lsp/... ./repl/...

    - name: Build the binary for Windows
      run: |
        mkdir -p release
        $env:CGO_ENABLED="0"
        $env:GOOS="windows"
        $env:GOARCH="amd64"
        go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o release/turtle-windows-amd64.exe ./cmd/turtle

    - name: Create Windows Installer
      run: |
        # installer/turtle.iss: Program Files, PATH, .turtle files, Start menu.
        choco install innosetup -y --no-progress
        $version = "${{ github.ref_name }}".TrimStart("v")
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DTurtleExe=..\release\turtle-windows-amd64.exe" "/DOutputDir=..\release" installer\turtle.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Windows Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        # 0.x versions are pre-releases: GitHub shows the badge.
        prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
        files: |
          release/turtle-windows-amd64-setup.exe
          release/turtle-windows-amd64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep the newest 5 releases; older release pages go (their tags stay).
  # Only after all three builds succeed, so a failed release removes nothing.
  prune-releases:
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
    - name: Delete releases past the newest 5
      run: |
        for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[5:][].tagName'); do
          echo "deleting release $tag (the tag stays)"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
